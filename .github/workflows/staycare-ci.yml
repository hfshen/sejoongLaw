name: StayCare CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: staycare-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: https://www.sejoonglaw.kr
      STAYCARE_TENANT_SLUG: sejoong-staycare
      STAYCARE_DEFAULT_LOCALE: ko
      STAYCARE_SUPPORT_EMAIL: staycare@sejoonglaw.kr
      STAYCARE_STORAGE_BUCKET: staycare-private
      NEXT_PUBLIC_STAYCARE_DEMO_LOGIN_ENABLED: "false"
      STAYCARE_ALLOW_PRODUCTION_DEMO_LOGIN: "false"
      STAYCARE_RATE_LIMIT_FAIL_CLOSED: "true"
      STAYCARE_DOCUMENT_RETENTION_DAYS: "1095"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-for-ci-only
      STAYCARE_WEBHOOK_SECRET: test-webhook-secret-for-ci-only
      STAYCARE_CRON_SECRET: test-cron-secret-for-ci-only
      STAYCARE_FIELD_ENCRYPTION_KEY: test-field-encryption-key-for-ci-only
      OPENAI_API_KEY: test-openai-key
      OPENAI_TRANSLATION_MODEL: gpt-5
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: test-upstash-token
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: re_test_ci_only
      RESEND_FROM_EMAIL: Sejoong StayCare <staycare@example.com>
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      NEXT_PUBLIC_SENTRY_DSN: https://public@example.ingest.sentry.io/1
      TELECOM_PROVIDER_MODE: manual
      BANK_PROVIDER_MODE: manual
      REMITTANCE_PROVIDER_MODE: manual
      DELIVERY_PROVIDER_MODE: manual
      GOOGLE_VERIFICATION: test
      NAVER_VERIFICATION: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Verify lockfile is reproducible
        run: git diff --exit-code -- package-lock.json

      - name: Audit critical production dependencies
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=critical 2>&1 | tee npm-audit.log

      - name: Validate commercial environment contract
        run: npm run check:staycare-env:strict 2>&1 | tee staycare-env.log

      - name: Validate four-language coverage
        run: npm run check:staycare-i18n 2>&1 | tee staycare-i18n.log

      - name: Lint application
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Publish TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '## StayCare TypeScript diagnostics'
            echo
            echo '```text'
            sed -n '1,180p' typecheck.log
            echo '```'
            echo
            echo "Commit: $GITHUB_SHA"
          } > /tmp/staycare-typecheck-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/staycare-typecheck-comment.md

      - name: Enforce TypeScript result
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Run StayCare tests
        run: |
          set -o pipefail
          npx jest __tests__/staycare --runInBand 2>&1 | tee staycare-tests.log

      - name: Build application
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staycare-validation-${{ github.run_id }}
          path: |
            npm-audit.log
            staycare-env.log
            staycare-i18n.log
            lint.log
            typecheck.log
            staycare-tests.log
            build.log
          if-no-files-found: ignore
          retention-days: 14
