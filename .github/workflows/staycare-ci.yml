name: Apply StayCare lint corrections

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: staycare-lint-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'agent/staycare-four-language'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct Hook order and memoization
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery = Path('components/staycare/StayCareAuthRecoveryNotice.tsx')
          source = recovery.read_text()
          before = '''}) {
            if (reason !== "otp_expired") return null

            const initialLanguage = normalizeStayCareLocale(locale)
            const { language } = useStayCareLanguage(initialLanguage)
            const text = copy[language]
          '''
          after = '''}) {
            const initialLanguage = normalizeStayCareLocale(locale)
            const { language } = useStayCareLanguage(initialLanguage)

            if (reason !== "otp_expired") return null
            const text = copy[language]
          '''
          if before not in source:
              raise SystemExit('Auth recovery Hook pattern not found')
          recovery.write_text(source.replace(before, after, 1))

          workspace = Path('components/staycare/StayCareStaffWorkspace.tsx')
          source = workspace.read_text()
          source = source.replace(
              'import { useMemo, useState } from "react"',
              'import { useState } from "react"',
              1,
          )
          source = source.replace(
              'const filteredApplications = useMemo(() => applications.filter((item) => {',
              'const filteredApplications = applications.filter((item) => {',
              1,
          )
          source = source.replace(
              '}), [applications, query, role])',
              '})',
              1,
          )
          if 'useMemo' in source or '[applications, query, role])' in source:
              raise SystemExit('Staff workspace memoization pattern remains')
          workspace.write_text(source)
          PY

      - name: Validate source corrections
        run: |
          node scripts/check-staycare-i18n.mjs
          git diff --check

      - name: Commit source corrections
        run: |
          git config user.name 'StayCare Release Bot'
          git config user.email 'staycare-release@users.noreply.github.com'
          git add components/staycare/StayCareAuthRecoveryNotice.tsx components/staycare/StayCareStaffWorkspace.tsx
          git diff --cached --check
          git commit -m 'fix: satisfy StayCare React Hook lint rules'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
